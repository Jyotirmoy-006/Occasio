<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Occasio — Title Card</title>
  <link rel="stylesheet" href="./demo-cards.css">
</head>
<body class="demo-canvas">
  <div class="stationery-card">
    <div class="gold-corner top-left"></div>
    <div class="gold-corner top-right"></div>
    <div class="gold-corner bottom-left"></div>
    <div class="gold-corner bottom-right"></div>

    <div class="top-meta-row">
      <div class="monogram-seal">O</div>
      <div class="meta-brand-title">Occasio &bull; Event Arts</div>
    </div>

    <div>
      <h1 class="s1-title-headline">Occasio</h1>
      <p class="s1-plain-line">A planning assistant for weddings, birthdays and community events.</p>

      <div class="s1-pillars-row">
        <div class="s1-pillar-pill" id="pillar-budget">Budget</div>
        <div class="s1-pillar-pill" id="pillar-timeline">Timeline</div>
        <div class="s1-pillar-pill" id="pillar-vendors">Vendors</div>
        <div class="s1-pillar-pill" id="pillar-ideas">Ideas</div>
        <button class="s1-cta-button" id="title-cta-btn">Let&apos;s plan a wedding &rarr;</button>
      </div>
    </div>

    <div class="top-meta-row">
      <div class="meta-brand-title">Deterministic calculations &bull; Local-first &bull; Tested open source</div>
    </div>
  </div>
</body>
</html>
