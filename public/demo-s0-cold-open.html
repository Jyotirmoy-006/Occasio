<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Occasio — Cold Open</title>
  <link rel="stylesheet" href="./demo-cards.css">
</head>
<body class="demo-canvas">
  <div class="stationery-card">
    <div class="gold-corner top-left"></div>
    <div class="gold-corner top-right"></div>
    <div class="gold-corner bottom-left"></div>
    <div class="gold-corner bottom-right"></div>

    <div class="top-meta-row">
      <div class="monogram-seal">O</div>
      <div class="meta-brand-title">Occasio &bull; Event Arts &amp; Planning</div>
    </div>

    <div class="tabs-stage-container">
      <h1 class="cold-open-headline">How many tabs does it take to plan a wedding?</h1>

      <div class="tabs-spread" id="tabs-spread">
        <div class="browser-tab-chip" id="tab-0">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>
          <span>Budget.xlsx</span>
        </div>
        <div class="browser-tab-chip" id="tab-1">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Vendor emails (47)</span>
        </div>
        <div class="browser-tab-chip" id="tab-2">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Checklist</span>
        </div>
        <div class="browser-tab-chip" id="tab-3">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Venue quote.pdf</span>
        </div>
        <div class="browser-tab-chip" id="tab-4">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <span>Inspiration board</span>
        </div>

        <div class="monogram-ripple-ring" id="monogram-ring"></div>
        <div class="center-monogram-target" id="monogram-target">O</div>
      </div>
    </div>

    <div class="top-meta-row">
      <div class="meta-brand-title">A single calm surface for budgets, deadlines, vendors, and ideas.</div>
    </div>
  </div>

  <script src="./demo-s0-animation.js"></script>
</body>
</html>
