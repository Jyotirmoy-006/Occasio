<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Stationery color swatch fan -->
  <!-- Swatch 1 (Left tilt) -->
  <g transform="rotate(-20 120 140)">
    <rect x="105" y="45" width="30" height="90" rx="3" fill="#FFFDF8" stroke="#E6DFD5" stroke-width="1.2" />
    <rect x="108" y="48" width="24" height="35" rx="2" fill="#EAF3EE" stroke="#2F6B4F" stroke-width="0.75" />
  </g>
  
  <!-- Swatch 2 (Center) -->
  <g transform="rotate(0 120 140)">
    <rect x="105" y="40" width="30" height="95" rx="3" fill="#FFFDF8" stroke="#E6DFD5" stroke-width="1.2" />
    <rect x="108" y="43" width="24" height="35" rx="2" fill="#FCF6E8" stroke="#8A5A00" stroke-width="0.75" />
  </g>
  
  <!-- Swatch 3 (Right tilt) -->
  <g transform="rotate(22 120 140)">
    <rect x="105" y="45" width="30" height="90" rx="3" fill="#FFFDF8" stroke="#E6DFD5" stroke-width="1.2" />
    <rect x="108" y="48" width="24" height="35" rx="2" fill="#FDEEED" stroke="#9B2C2C" stroke-width="0.75" />
  </g>
  
  <!-- Pivot brass grommet -->
  <circle cx="120" cy="130" r="4.5" fill="#D9B65B" stroke="#8A6A12" stroke-width="1.5" />
  <circle cx="120" cy="130" r="1.5" fill="#FFFDF8" />
  
  <!-- Brass drafting compass on the side -->
  <g transform="translate(145, 55) rotate(15)">
    <circle cx="20" cy="10" r="4" fill="#F1EADC" stroke="#8A6A12" stroke-width="1.2" />
    <path d="M18 13 L6 65" stroke="#8A6A12" stroke-width="1.5" />
    <path d="M22 13 L34 65" stroke="#8A6A12" stroke-width="1.5" />
    <path d="M10 40 Q20 45 30 40" stroke="#D9B65B" stroke-width="1" fill="none" />
  </g>
  
  <!-- Star / Spark of inspiration -->
  <path d="M70 50 Q75 40 80 50 Q90 55 80 60 Q75 70 70 60 Q60 55 70 50 Z" fill="#D9B65B" fill-opacity="0.35" stroke="#8A6A12" stroke-width="1" />
</svg>

